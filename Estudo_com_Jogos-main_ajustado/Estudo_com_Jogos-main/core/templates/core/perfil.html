{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Usuário — Estudo com Jogos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
  <link rel="stylesheet" href="{% static 'css/perfil.css' %}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
</head>

<body data-username="{% if user.is_authenticated %}{{ user.username }}{% endif %}">

  {% include 'core/sidebar.html' %}

  <!-- ===== ÁREA PRINCIPAL DO CONTEÚDO ===== -->
  <main class="main-content" id="mainContent">
    <div class="profile-card">

      <!-- BANNER COM BOTÃO DE ALTERAR -->
      <div class="banner-wrapper">
        <img id="bannerImg"
          src="https://images.unsplash.com/photo-1707343843437-caacff5cfa74?w=1200&auto=format&fit=crop&q=80"
          alt="Banner do Perfil">
        <label for="bannerInput" class="btn-change-banner" title="Trocar Banner">
          📷 Trocar Banner
        </label>
        <input type="file" id="bannerInput" accept="image/*">
      </div>

      <!-- ÁREA PRINCIPAL DO PERFIL -->
      <div class="profile-body">

        <!-- FOTO DE PERFIL (AVATAR) COM BOTÃO DE ALTERAR -->
        <div class="avatar-wrapper">
          <img id="avatarImg" src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png"
            alt="Foto de Perfil">
          <label for="avatarInput" class="btn-change-avatar" title="Trocar Foto">
            📷
          </label>
          <input type="file" id="avatarInput" accept="image/*">
        </div>

        <!-- INFORMAÇÕES DO USUÁRIO -->
        <div class="profile-details">

          <!-- 1. MODO DE VISUALIZAÇÃO -->
          <div id="viewMode">
            <h1 id="displayName">{{ user.username }}</h1>
            <p class="tagline" id="displayHeadline">Qual sua profissão?</p>
            <p class="bio" id="displayBio">Adicione uma breve descrição sobre você</p>

            <div class="meta-info">
              <span id="displayLocation">📍 Adicione sua cidade</span>
              <span id="displayStatus">💬 Adicione seu status</span>
            </div>

            <button id="btnEdit" class="btn btn-primary">Editar Perfil</button>
          </div>

          <!-- 2. MODO DE EDIÇÃO (FORMULÁRIO) -->
          <form id="editForm" class="edit-form" style="display: none;">
            <div class="form-group">
              <label for="inputName">Nome</label>
              <input type="text" id="inputName" required>
            </div>

            <div class="form-group">
              <label for="inputHeadline">Ocupação / Curso</label>
              <input type="text" id="inputHeadline">
            </div>

            <div class="form-group">
              <label for="inputBio">Biografia</label>
              <textarea id="inputBio" rows="3"></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="inputLocation">Localização</label>
                <input type="text" id="inputLocation">
              </div>
              <div class="form-group">
                <label for="inputStatus">Status</label>
                <input type="text" id="inputStatus">
              </div>
            </div>

            <div class="form-actions">
              <button type="button" id="btnCancel" class="btn btn-secondary">Cancelar</button>
              <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </main>

  <!-- MODAL DE CORTE DE IMAGEM -->
  <div id="cropModal" class="crop-modal">
    <div class="crop-modal-content">
      <h2>Ajustar Imagem</h2>
      <div class="crop-container">
        <img id="cropImage" src="">
      </div>
      <div class="crop-actions">
        <button type="button" id="btnCancelCrop" class="btn btn-secondary">Cancelar</button>
        <button type="button" id="btnApplyCrop" class="btn btn-primary">Aplicar</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="{% static 'js/perfil.js' %}?v=1.3"></script>

</body>

</html>
