<!DOCTYPE html>
<html lang="pt-br">
<head>

<body>
    <div class="metade-da-tela">
         <h1>Faça login para acessar sua conta e começar a explorar!</h1>
    </div>
     <div class="caixa-topo">
    <i class="bi bi-joystick"></i><p>Estudo com Jogos</p>
        <a href="cadastro.html">Cadastro</a>
    </div>
    <div class="container">
        <form>
            <h1>Entre em sua conta</h1>
            <input type="text" id="username" name="username" required placeholder="Nome de usuário">
            <i class="bi bi-lock-fill"></i><input type="password" id="password" name="password" required placeholder="Senha">
            <br></br>
            <button type="submit">Entrar</button>
        </form>
    </div>
