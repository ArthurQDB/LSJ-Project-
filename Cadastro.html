<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="cssbasico.css">
    <title>Cadastro</title>
</head>
<body>
    <h1>Cadastre-se</h1>
    <div class="criar-conta">
    <form>
        <input type="text" id="username" name="username" required placeholder="Nome de usuário"> <br><br>
        <input type="email" id="email" name="email" required placeholder="Email"><br><br>
        <input type="password" id="password" name="password" required placeholder="Senha"><br><br>
        <button type="submit">Cadastrar</button>
    </form>
</div>
</body>
</html>
