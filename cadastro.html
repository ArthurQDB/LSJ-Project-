<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="cssbasico.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title>Cadastro</title>
</head>

<body>
    <div class="caixa-topo">
        <div class="caixa-topo-esquerda" onclick="window.location.href='index.html'">
            <i class="bi bi-joystick"></i>
            <p>Estudos com Jogos</p>
        </div>
        <div class="caixa-topo-direita">
            <a href="cadastro.html">Cadastro</a>
            <a href="login.html">Login</a>
        </div>
    </div>
    <h1>Cadastre-se para acessar o sistema</h1>
    <div class="criar-conta">
        <form>
            <div class="input-wrapper">
                <i class="bi bi-person-fill"></i>
                <input type="text" id="username" name="username" required placeholder="Nome de usuário">
            </div>
            <div class="input-wrapper">
                <i class="bi bi-envelope-fill"></i>
                <input type="email" id="email" name="email" required placeholder="Email">
            </div>
            <div class="input-wrapper">
                <i class="bi bi-lock-fill"></i>
                <input type="password" id="password" name="password" required placeholder="Senha">
            </div>
            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>

</html>
